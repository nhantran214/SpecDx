[project]
name = "tonomyx"
version = "0.1.0"
description = "Autonomous Enterprise backend driven by Canon Pack CASE-0031 v2.0"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "jsonschema>=4.23",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
tonomyx = "tonomyx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tonomyx*"]

[tool.setuptools.package-data]
tonomyx = ["flow/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: requires a live PostgreSQL started by docker compose"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The canon pack is read-only ground truth, not our code; its own Python files
# (validate.py and similar) are never edited here, so ruff must not lint them.
exclude = ["data/canon_pack_CASE-0031_v2.0/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() is evaluated once per request by the framework, not at
# import time, so it is not the mutable-default hazard B008 looks for.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tonomyx"]
